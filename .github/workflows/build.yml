# CI: the generated tree is no longer committed (Vercel builds from records).
name: ci
on:
  push:
    paths: ["records/**", "site/**", "app/**", "ingest/**", "generators/**", "tests/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install pytest && python3 -m pytest -q
      - run: python3 site/build.py
